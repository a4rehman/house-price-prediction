name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check src tests scripts

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  train-model:
    name: Train model & upload artifacts
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run training pipeline
        run: |
          python scripts/run_training.py --no-tune --no-mlflow

      - name: Verify API boots and predicts
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from src.api.main import app
          with TestClient(app) as c:
              h = c.get("/health")
              assert h.status_code == 200, h.text
              r = c.post("/api/v1/predict", json={"OverallQual": 7, "GrLivArea": 1800})
              assert r.status_code == 200, r.text
              assert r.json()["predicted_price"] > 0
          print("API smoke test passed")
          EOF

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: house-price-artifacts
          path: |
            artifacts/
            data/processed/
          retention-days: 14
